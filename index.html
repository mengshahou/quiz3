<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测测你的本命小众工作</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            moran1: '#F7F4F1',
            moran2: '#E8E4EF',
            moran3: '#D8E1E8',
            moran4: '#EEDFDD',
            moran5: '#F3EBDB',
            morantext: '#5A545C',
            moranaccent: '#B8A8B8'
          },
          fontFamily: {
            sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow {
        box-shadow: 0 6px 18px rgba(184, 168, 184, 0.12);
      }
      .option-item {
        transition: 0.2s ease;
      }
      .option-item:active {
        transform: scale(0.97);
      }
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #F7F4F1;
      color: #5A545C;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-md mx-auto px-5 py-8">
    <!-- 封面页 -->
    <div id="page-start" class="block">
      <div class="rounded-3xl p-7 bg-white card-shadow text-center">
        <p class="text-sm tracking-widest mb-2 text-moranaccent">✨ 趣味心理小测试 ✨</p>
        <h1 class="text-[24px] font-medium leading-relaxed mb-4">测测你的本命小众工作<br />你最适合做什么样的小众工作？</h1>
        <p class="text-sm leading-relaxed text-morantext/80 mb-7">
          不想挤热门内卷赛道？<br />
          29道轻量选择题 + 一道爱好开放题<br />
          从性格偏好+你的真实爱好，找到适配你的冷门宝藏职业<br />
          结果含入门指南&岗位小短板，温柔接地气，可直接截图发小红书
        </p>
        <button onclick="startTest()" class="w-full py-3 rounded-full bg-moran2 text-morantext font-medium">
          开始测试
        </button>
        <p class="mt-4 text-xs text-morantext/60">每题凭第一直觉选择哦，支持返回上一题修改</p>
      </div>
    </div>
    <!-- 答题页 -->
    <div id="page-question" class="hidden">
      <div class="rounded-3xl p-6 bg-white card-shadow">
        <div class="flex justify-between items-center mb-5">
          <span class="text-xs text-moranaccent">题目 <span id="q-index">1</span>/29</span>
          <div class="h-1 w-24 bg-moran1 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-moranaccent w-[4%]"></div>
          </div>
        </div>
        <h2 id="q-title" class="text-lg font-medium mb-6 leading-relaxed"></h2>
        <div id="option-wrap" class="space-y-3">
        </div>
        <div class="mt-6 grid grid-cols-2 gap-3">
          <button onclick="prevQuestion()" id="btn-prev" class="py-3 rounded-full bg-white border border-moran2 text-morantext font-medium disabled:opacity-40" disabled>
            上一题
          </button>
          <button onclick="nextQuestion()" id="btn-next" class="py-3 rounded-full bg-moran2 text-morantext font-medium disabled:opacity-40" disabled>
            下一题
          </button>
        </div>
      </div>
    </div>
    <!-- 爱好开放题页面（新增） -->
    <div id="page-hobby" class="hidden">
      <div class="rounded-3xl p-7 bg-white card-shadow">
        <p class="text-sm text-moranaccent mb-1">🎁 附加题（选填）</p>
        <h2 class="text-lg font-medium mb-4">你目前有哪些爱好？按熟悉程度排序</h2>
        <p class="text-sm text-morantext/80 mb-4">多个爱好用中文逗号隔开，例子：徒步，古籍阅读，手工做香，摄影<br>可以留空，跳过这一题</p>
        <textarea id="hobby-input" class="w-full p-3 rounded-xl bg-moran1 outline-none border-none resize-none" rows="4" placeholder="在这里填写你的爱好..."></textarea>
        <div class="mt-6 grid grid-cols-2 gap-3">
          <button onclick="skipHobby()" class="py-3 rounded-full bg-white border border-moran2 text-morantext font-medium">跳过</button>
          <button onclick="submitHobby()" class="py-3 rounded-full bg-moran2 text-morantext font-medium">提交爱好</button>
        </div>
      </div>
    </div>
    <!-- 结果页 -->
    <div id="page-result" class="hidden">
      <div class="rounded-3xl p-7 bg-white card-shadow">
        <div class="text-center mb-5">
          <p class="text-sm text-moranaccent mb-1">你的本命小众工作</p>
          <h2 id="result-name" class="text-[22px] font-medium"></h2>
        </div>
        <div id="result-desc" class="space-y-4 text-sm leading-relaxed"></div>
        <!-- 爱好推荐区域 -->
        <div id="hobby-recommend-block" class="mt-6 pt-5 border-t border-moran1 hidden">
          <p class="text-sm text-moranaccent mb-2">🎁 根据你的爱好额外推荐</p>
          <div id="hobby-result-text" class="text-sm leading-relaxed"></div>
        </div>
        <div class="mt-7">
          <button onclick="resetTest()" class="w-full py-3 rounded-full bg-moran2 text-morantext font-medium">
            重新测试
          </button>
        </div>
        <p class="mt-4 text-xs text-center text-morantext/60">本测试为趣味参考，职业选择仍需要结合自身现实条件</p>
      </div>
    </div>
  </div>
  <script>
    // 共29题，原第6题替换为5道递进深挖题
    const questions = [
      {q:"休息的时候，你更偏向？",o:["一个人安静待着充电","和1-2个熟悉好友小聚","和一群人热闹玩耍","随缘，看当下心情"]},
      {q:"做事情，你更喜欢？",o:["细致打磨，抠细节，慢工出细活","把控大方向，规划全局","跟着流程按部就班走","即兴发挥，随机应变"]},
      {q:"环境偏好，你更喜欢？",o:["安静独立的单人空间（工作室/书房）","户外自然环境（山林、田野、海边）","简单的办公室，少量同事","充满烟火、热闹有生机的地方"]},
      {q:"面对收入，你的想法是？",o:["稳定优先，波动越小越好","可以小幅浮动，底线安稳","能接受阶段性不稳定，上限重要","不执着高薪，自己喜欢最重要"]},
      {q:"面对陌生冷门知识，你会？",o:["好奇，愿意深挖钻研","觉得有趣，浅尝了解一下","用处不大就不想看","没兴趣，更喜欢实用内容"]},
      // ========== 新增5道递进深挖题（替换原来的旧第6题） ==========
      {q:"【偏好对象】长期工作中，你更愿意主要和哪一类事物打交道？",o:["文字、史料、故事、人文思想","实物、材料、器物、手工物件","动植物、野外环境、生态自然","图像、画面、光影、视觉视听内容"]},
      {q:"【行为倾向】面对你喜欢的这类事物，你最享受做的事是？",o:["解读考证、梳理背后故事","动手改造、打磨、制作出新东西","安静观察、持续记录它本来的样子","剪辑编排、营造氛围与感官体验"]},
      {q:"【容错心态】如果它存在瑕疵、破损或者不完美，你会倾向？",o:["考据溯源，尝试修复还原","重新加工，改造成更好的版本","原样留存，客观记录不干预","把瑕疵转化成独特的氛围感"]},
      {q:"【成果载体】最终产出的成果，你更希望是？",o:["图文文稿、档案、文字记录","可以触摸、留存的实体物件","生态观察记录、生物影像台账","音频、短片、氛围感视听作品"]},
      {q:"【信息接收】接触这类事物时，你更依赖？",o:["阅读文字资料、前人记载","亲手触摸、感受材质质感","现场实地、持续野外观察","耳朵、眼睛沉浸式感受氛围"]},
      // ============================================================
      {q:"你更擅长？",o:["捕捉情绪，读懂别人没说出口的感受","挖掘信息，考证溯源找真相","动手实操，把想法变成实物","组织协调，串联人和事"]},
      {q:"长期重复一样的工作，你会？",o:["可以接受，稳定节奏很安心","适度重复可以，需要定期新挑战","很快觉得枯燥，想要变化","只要内容有意思，重复没关系"]},
      {q:"别人评价你，更常是？",o:["内敛敏感，心思细腻","想法独特，脑洞很大","靠谱踏实，执行力强","温和善聊，擅长倾听"]},
      {q:"学习新东西，偏好？",o:["慢慢沉浸式自学","有人一对一引导教学","跟着课程体系系统学","边做边学，实践出真知"]},
      {q:"如果要产出作品，你偏爱？",o:["不需要很多人看见，自己满意为主","小圈子同好欣赏就足够","希望被更多人认可传播","作品可以解决实际问题"]},
      {q:"你对风险的接受度？",o:["尽量规避风险，稳妥第一","低风险尝试，不赌全部","愿意承担中等风险试错","喜欢探索未知，不怕试错失败"]},
      {q:"空闲刷内容，更容易被什么吸引？",o:["古籍、民俗、冷知识、人文故事","植物、地质、生态、自然科普","手工、器物、复古物件、工艺","播客、声音、配乐、氛围感内容"]},
      {q:"协作模式你更喜欢？",o:["独立完成，少对接沟通","双人搭档，默契配合","小团队，分工清晰","多人团队，频繁沟通碰撞"]},
      {q:"安排一天，你喜欢？",o:["宽松无计划，自由随心","简单框架，弹性安排","详细清单，按计划执行","紧凑充实，事情排满"]},
      {q:"面对琐碎繁杂的细节工作？",o:["不排斥，甚至享受整理梳理","必要时可以做，但不想长期做","很容易烦躁，尽量避开","看事情价值，值得就扛下来"]},
      {q:"工作成果，你想要？",o:["精神满足大于物质回报","有长期沉淀，越老越吃香","看得见实物成果，很有成就感","可以持续迭代，不断出新"]},
      {q:"遇到突发变化？",o:["容易焦虑，希望尽快回归稳定","冷静，快速调整方案","觉得新鲜，期待变化","有点抗拒，但会配合调整"]},
      {q:"你更喜欢输出形式？",o:["文字、随笔、记录、叙事","图像、手作、实物创作","声音、旁白、播客、配音","调研笔记、资料整理、档案"]},
      {q:"关于名气曝光？",o:["完全不爱出镜曝光，低调为主","少量曝光，只在同好圈","适度分享，不排斥走红","希望被看见，积累个人影响力"]},
      {q:"下面哪件事会让你有成就感？",o:["读懂一段古老文字、还原一段故事","亲手修好/做好一件旧器物","观察记录自然生物、生态变化","安静陪伴、疏导别人的情绪"]},
      {q:"你讨厌的工作特质？",o:["无休止无效社交应酬","死板规则，没有发挥空间","重复机械，毫无成长","不确定性太强，没有底线"]},
      {q:"你对冷门小众事物的态度？",o:["痴迷，愿意深耕小众赛道","觉得有意思，当作爱好","知道就好，不会投入太多","更喜欢大众成熟赛道"]},
      {q:"最后一题：你择业第一优先级？",o:["内心热爱，做起来不内耗","时间自由，掌控自己节奏","稳定保障，生活踏实","成长空间，持续增值"]}
    ]
    // 8种结果类型，每个类型内置岗位池子，每次随机抽3条展示
    const resultPool = [
      {
        id:"R0",
        name:"📜 人文考据叙事型｜故事打捞者",
        trait:"你偏爱文字、历史、人的故事，擅长在别人忽略的角落打捞温柔的细节，不喜欢喧嚣内卷，适合慢节奏、有沉淀感的赛道。",
        jobs:[
          {title:"地方民俗撰稿人",desc:"收集小城老故事、民间传说、老街口述历史，写专栏，不用坐班。入门：走访老街，练习口述记录，从本地小故事发笔记。短板：变现慢，前期收入微薄，需要长期沉淀。"},
          {title:"古籍/旧书修复助理",desc:"和老书本打交道，修补破损书页，安静治愈。入门：线下古籍修复体验课，图书馆古籍馆招学徒。短板：上手周期很长，岗位极少。"},
          {title:"方言记录整理员",desc:"记录濒危方言、词汇、童谣，给方言建档。入门：记录家乡方言，投稿方言保护项目。短板：公益属性强，全职稀缺。"},
          {title:"博物馆小众展区讲解员",desc:"不做通用讲解，深耕民俗、古器物冷门展区。入门：报名博物馆志愿者，吃透一个展区史料。短板：大多兼职，全职名额很少。"},
          {title:"复古文献排版设计师",desc:"复刻老书版式、民国海报排版，做复古图文。入门：学习排版软件，临摹老刊物版式。短板：客户群体很小，慢慢积累客源。"},
          {title:"非遗文字记录专员",desc:"帮非遗手艺人整理口述档案、撰写申报材料。入门：练习采访纪实写作，对接本地非遗中心。短板：项目制为主，收入不稳定。"},
          {title:"田野调研助理（人文方向）",desc:"跟着课题组下乡，收集口述史料、村落民俗记录。入门：高校人文课题组常招短期助理。短板：外勤辛苦，大多项目兼职。"},
          {title:"老照片整理修复撰稿",desc:"整理家庭、档案馆老照片，配上时代背景文字故事。入门：学习简单照片修复，接单家庭影像整理。短板：客单零散，单价不高。"},
          {title:"地方志资料摘抄员",desc:"摘抄、校勘地方旧志，给文史机构整理素材。入门：熟悉繁体、竖排文字，对接地方文史馆外包。短板：枯燥，长时间阅读旧文献。"},
          {title:"独立书评人（冷门文史书籍）",desc:"专注小众文史、旧书书评，给小众平台供稿。入门：持续输出读书随笔，垂直冷门书单。短板：很难稳定变现。"}
        ]
      },
      {
        id:"R1",
        name:"🌿 自然观察治愈型｜山野记录者",

        jobs:[
          {title:"自然导赏员",desc:"带游客认识植物、昆虫、矿石，山野轻科普。入门：考取导赏证书，跟着本地自然社群带队。短板：周末节假日上班，日晒雨淋，淡季收入低。"},
          {title:"植物标本制作师",desc:"压制、装帧植物标本，做标本礼盒、科普教具。入门：自学标本压制，小红书出作品接单。短板：季节性强，南方潮湿容易发霉损耗。"},
          {title:"生态调查助理",desc:"野外记录动植物，填写生态台账。入门：环保机构经常招零基础兼职助理。短板：外勤辛苦，部分野外地点条件简陋。"},
          {title:"野花原生植物摄影师",desc:"专注野生植物微距拍摄，供稿科普平台。入门：家门口公园、小区开始积累图库。短板：出片慢，图库供稿单价不高。"},
          {title:"堆肥&原生园艺顾问",desc:"家庭菜园、原生花园、生态堆肥指导。入门：自学朴门园艺，从小单家庭指导做起。短板：受众小众，市场培育慢。"},
          {title:"观鸟向导",desc:"带队观鸟，讲解鸟类习性，记录鸟种。入门：自学认鸟，加入本地观鸟协会积累经验。短板：依赖天气，旺季集中迁徙季。"},

          {title:"昆虫标本整理师",desc:"昆虫标本制作、整姿、科普展陈布置。入门：先学习规范标本制作，遵守生物保护法规。短板：部分人会害怕昆虫。"}

        jobs:[

      [6,0,7,5],
      [0,3,4,7],
      [0,7,1,6],
      [0,1,2,5],
      [5,6,7,0],
      [0,7,1,2],
      [0,7,6,5]
    ]
    let current = 0;
    let score = [0,0,0,0,0,0,0,0];
    let selected = -1;
    let answerRecord = Array(questions.length).fill(-1);
    let hobbyRecommendList = [];
    function startTest(){
      document.getElementById("page-start").classList.add("hidden");
      document.getElementById("page-question").classList.remove("hidden");
      renderQuestion();
    }
    function renderQuestion(){
      const q = questions[current];
      document.getElementById("q-index").innerText = current+1;
      document.getElementById("q-title").innerText = q.q;
      const wrap = document.getElementById("option-wrap");
      wrap.innerHTML = "";
      selected = answerRecord[current];
      document.getElementById("btn-next").disabled = selected === -1;
      document.getElementById("btn-prev").disabled = current === 0;
      const per = ((current+1)/questions.length*100).toFixed(0);
      document.getElementById("progress-bar").style.width = per+"%";
      q.o.forEach((txt,i)=>{
        const div = document.createElement("div");
        div.className = "option-item p-3 rounded-xl bg-moran1 cursor-pointer";
        if(i === selected){
          div.classList.add("bg-moran2");
        }
        div.innerText = txt;
        div.onclick = ()=>{
          document.querySelectorAll(".option-item").forEach(el=>el.classList.remove("bg-moran2"));
          div.classList.add("bg-moran2");
          selected = i;
          answerRecord[current] = i;
          document.getElementById("btn-next").disabled = false;
        }
        wrap.appendChild(div);
      })
    }
    function undoScore(qIndex){
      const oldSel = answerRecord[qIndex];
      if(oldSel !== -1){
        const oldType = map[qIndex][oldSel];
        score[oldType] -= 1;
      }
    }
    function nextQuestion(){
      answerRecord[current] = selected;
      const typeIdx = map[current][selected];
      score[typeIdx] += 1;
      current += 1;
      if(current >= questions.length){
        // 做完29道单选，跳爱好附加题
        document.getElementById("page-question").classList.add("hidden");
        document.getElementById("page-hobby").classList.remove("hidden");
      }else{
        renderQuestion();
      }
    }
    function prevQuestion(){
      undoScore(current);
      current -= 1;
      renderQuestion();
    }
    // 爱好匹配函数：最多取出前2个匹配结果
    function matchHobby(text){
      hobbyRecommendList = [];
      if(!text.trim()) return;
      const hobbyArr = text.split(/[,，]/).map(s=>s.trim()).filter(s=>s);
      for(const hobby of hobbyArr){
        for(const libItem of hobbyMatchLib){
          if(libItem.keys.some(k=>hobby.includes(k))){
            if(!hobbyRecommendList.includes(libItem.job)){
              hobbyRecommendList.push(libItem.job);
            }
          }
        }
      }
      hobbyRecommendList = hobbyRecommendList.slice(0,2);
    }
    function submitHobby(){
      const val = document.getElementById("hobby-input").value;
      matchHobby(val);
      showResult();
    }
    function skipHobby(){
      hobbyRecommendList = [];
      showResult();
    }
    // 数组随机洗牌
    function shuffle(arr){
      let tmp = [...arr];
      for(let i=tmp.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [tmp[i],tmp[j]] = [tmp[j],tmp[i]];
      }
      return tmp;
    }
    function showResult(){
      document.getElementById("page-hobby").classList.add("hidden");
      document.getElementById("page-result").classList.remove("hidden");
      const maxVal = Math.max(...score);
      const resIdx = score.indexOf(maxVal);
      const res = resultPool[resIdx];
      document.getElementById("result-name").innerText = res.name;
      // 随机抽3个岗位展示
      const randomJobs = shuffle(res.jobs).slice(0,3);
      let html = `<p class="mb-3">${res.trait}</p>`;
      html += `<p class="font-medium text-moranaccent">✅ 适配职业清单</p>`
      randomJobs.forEach(j=>{
        html += `
        <p class="mt-2"><strong>▫️ ${j.title}</strong></p>
        <p>${j.desc}</p>
        `
      })
      document.getElementById("result-desc").innerHTML = html;
      // 爱好推荐渲染
      const block = document.getElementById("hobby-recommend-block");
      const textDom = document.getElementById("hobby-result-text");
      if(hobbyRecommendList.length > 0){
        block.classList.remove("hidden");
        let hhtml = "";
        hobbyRecommendList.forEach(item=>{
          hhtml += "▫️ "+item+"<br /><br />";
        })
        textDom.innerHTML = hhtml;
      }else{
        block.classList.add("hidden");
      }
    }
    function resetTest(){
      current = 0;
      score = [0,0,0,0,0,0,0,0];
      selected = -1;
      answerRecord = Array(questions.length).fill(-1);
      hobbyRecommendList = [];
      document.getElementById("page-result").classList.add("hidden");
      document.getElementById("page-hobby").classList.add("hidden");
      document.getElementById("page-start").classList.remove("hidden");
    }
  </script>
</body>
</html>
